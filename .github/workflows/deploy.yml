name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_data.py
      - run: npm ci
      - run: npm test
      # Real clinics for the demo area (Hai and Moshi Rural, Kilimanjaro) from OpenStreetMap, baked into the
      # build so the deployed app has real facilities even offline. The committed copy in data/ (from the
      # "Refresh real clinics" workflow) is used if the map servers are busy; it is only overwritten on success.
      - name: Fetch real facilities (OpenStreetMap)
        continue-on-error: true
        run: python scripts/fetch_facilities_osm.py --bbox=-3.45,37.10,-3.10,37.60 --out data/facilities_osm_kilimanjaro.json
      - name: Report which clinics are baked in
        run: |
          if [ -f data/facilities_osm_kilimanjaro.json ]; then
            python -c "import json;print('::notice::Real OSM clinics baked into build:',len(json.load(open('data/facilities_osm_kilimanjaro.json'))['facilities']))"
          else
            echo "::warning::No real clinics baked in; the app will fetch on the device or use sample clinics"
          fi
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
