// ---------- characters (origin = feet centre, ~300 units tall) ----------
function face(skin, y){
  return `<ellipse cx="0" cy="${y}" rx="22" ry="26" fill="${skin}"/>
  <circle cx="-8" cy="${y-3}" r="2.8" fill="#24160F"/><circle cx="8" cy="${y-3}" r="2.8" fill="#24160F"/>
  <path d="M-12 ${y-11} q4 -3 8 0 M4 ${y-11} q4 -3 8 0" stroke="#24160F" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M-7 ${y+11} q7 5 14 0" stroke="#4A2A1E" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
}
function woman(o){

  s+=`<path d="M-34 -192 C-42 -120 -56 -60 -60 -10 L60 -10 C56 -60 42 -120 34 -192Z" fill="${dress}"/>`;
  s+=`<path d="M-60 -10 L60 -10 L58 -26 L-58 -26Z" fill="#000" opacity=".18"/>`;
  if(pregnant) s+=`<ellipse cx="32" cy="-104" rx="42" ry="44" fill="${dress}" stroke="#000" stroke-opacity=".22" stroke-width="3"/><path d="M8 -138 C 50 -140 66 -90 40 -68" stroke="#000" stroke-opacity=".18" stroke-width="3" fill="none"/>`;
  s+=`<path d="M-36 -186 Q-52 -140 -46 -100" stroke="${dress}" stroke-width="20" stroke-linecap="round" fill="none"/><circle cx="-46" cy="-96" r="10" fill="${skin}"/>`;
  const babySvg = baby? `<g><ellipse cx="40" cy="-126" rx="42" ry="26" fill="url(#kit3)"/><circle cx="70" cy="-150" r="16" fill="${SK[2]}"/><path d="M55 -158 a16 16 0 0 1 30 0Z" fill="#E8A33D"/><circle cx="75" cy="-151" r="1.8" fill="#24160F"/><path d="M70 -143 q4 2 7 0" stroke="#4A2A1E" stroke-width="1.6" fill="none"/></g>`:'';
  s+=`<g id="${id}_armR" transform="${armR}"><path d="M36 -186 Q54 -140 48 -100" stroke="${dress}" stroke-width="20" stroke-linecap="round" fill="none"/><circle cx="48" cy="-96" r="10" fill="${skin}"/><g id="${id}_hold" opacity="0"></g></g>`+babySvg;
  // hijab
  s+=`<path d="M-56 -200 C-66 -176 66 -176 56 -200 C50 -214 -50 -214 -56 -200Z" fill="${hijab}"/>`;
  s+=`<path d="M-44 -206 C-52 -250 -40 -292 0 -294 C40 -292 52 -250 44 -206Z" fill="${hijab}"/>`;
  s+=`<path d="M-40 -212 C-44 -250 -34 -284 0 -286" stroke="${hijabTrim}" stroke-width="3" fill="none" opacity=".8"/>`;
  s+=face(skin,-240);
  s+=`<path d="M-24 -262 C-20 -276 20 -276 24 -262" stroke="${hijab}" stroke-width="6" fill="none"/>`;
  s+=`</g>`;return s;
}

}
function clinician(o){

  <path d="M-42 -194 Q-60 -150 -52 -110" stroke="#FAFAF7" stroke-width="20" stroke-linecap="round" fill="none"/><circle cx="-52" cy="-104" r="10" fill="${skin}"/>
  <path d="M42 -194 Q64 -160 44 -128" stroke="#FAFAF7" stroke-width="20" stroke-linecap="round" fill="none"/><circle cx="38" cy="-124" r="10" fill="${skin}"/>

  <rect x="-8" y="-218" width="16" height="20" fill="${skin}"/>

   <g fill="#C9CED2" font-size="16" text-anchor="middle" font-weight="700">${[1,2,3,4,5,6,7,8,9].map((n,i)=>`<text x="${-52+(i%3)*52}" y="${70+Math.floor(i/3)*46}">${n}</text>`).join('')}</g>
   <rect x="-34" y="20" width="68" height="18" rx="9" fill="#4F7F45"/>

}
function smsScreen(lines,from='AMARA'){
  let s=`<text x="-78" y="-158" font-size="13" font-weight="700" fill="#1F3A2E">✉ ${from}</text><line x1="-80" y1="-150" x2="80" y2="-150" stroke="#1F3A2E" stroke-opacity=".3"/>`;
  lines.forEach((l,i)=>{s+=`<text x="-78" y="${-130+i*19}" font-size="14.5" class="mono" fill="#13261E">${l}</text>`});
  return s;
}

// ---------- backgrounds ----------
function hills(dx=0){
  return `<rect width="1280" height="720" fill="url(#sky)"/>
  <g transform="translate(${dx*0.15},0)">
   <path d="M260 340 L520 196 Q560 176 600 186 L640 181 Q684 176 724 198 L1000 340Z" fill="#8A9B97"/>
   <path d="M505 206 L520 196 Q560 176 600 186 L640 181 Q684 176 724 198 L740 208 L706 214 L684 204 L654 218 L624 205 L594 220 L562 206 L532 218Z" fill="#F7F8F5"/>
  </g>
  <g transform="translate(${dx*0.35},0)"><path d="M-400 380 C-100 300 200 330 450 350 C700 370 900 300 1200 320 C1500 340 1700 360 1900 340 L1900 720 L-400 720Z" fill="#7FA36A"/></g>
  <g transform="translate(${dx*0.6},0)"><path d="M-400 430 C-100 390 300 420 600 410 C900 400 1100 380 1500 410 C1700 425 1900 410 2100 420 L2100 720 L-400 720Z" fill="#5E8B4E"/></g>`;
}
function coffee(x,y,s=1){return `<g transform="translate(${x},${y}) scale(${s})"><circle cx="0" cy="-30" r="30" fill="#2F5A2E"/><circle cx="-24" cy="-14" r="22" fill="#3A6B37"/><circle cx="22" cy="-12" r="24" fill="#2F5A2E"/>${[[-10,-34],[8,-22],[-26,-12],[20,-8],[2,-46]].map(([a,b])=>`<circle cx="${a}" cy="${b}" r="3.6" fill="#B3261E"/>`).join('')}</g>`}
function maize(x,y,s=1){return `<g transform="translate(${x},${y}) scale(${s})" stroke="#6E8F3A" stroke-width="5" fill="none" stroke-linecap="round"><path d="M0 0 L0 -120"/><path d="M0 -40 Q-30 -60 -44 -50"/><path d="M0 -70 Q30 -90 44 -80"/><path d="M0 -95 Q-24 -115 -36 -108"/><path d="M0 -120 l-6 -16 M0 -120 l6 -16" stroke="#D7B45A"/></g>`}
function house(x,y){return `<g transform="translate(${x},${y})"><rect x="0" y="-120" width="180" height="120" fill="#C9A27A"/><path d="M-16 -116 L90 -184 L196 -116Z" fill="#9AA3A6"/><path d="M-16 -116 L90 -184 L196 -116" stroke="#7D868A" stroke-width="4" fill="none"/><rect x="72" y="-70" width="40" height="70" fill="#6B4430"/><rect x="18" y="-92" width="34" height="28" fill="#4A5A5A"/><rect x="130" y="-92" width="34" height="28" fill="#4A5A5A"/></g>`}
function road(dx=0){return `<g transform="translate(${dx*0.6},0)"><path d="M-600 560 C-200 520 300 540 700 525 C1100 510 1500 530 2400 520 L2400 600 L-600 610Z" fill="#C8A27A"/></g>`}
function duka(){
  return `<rect width="1280" height="720" fill="#EFE4CF"/>
  <rect x="0" y="0" width="1280" height="90" fill="#0F4A3E"/>
  <text x="640" y="58" text-anchor="middle" font-size="34" font-weight="800" fill="#F3EEE3" letter-spacing="3">DUKA LA DAWA MUHIMU</text>
  <text x="640" y="82" text-anchor="middle" font-size="14" fill="#BFD8D5" letter-spacing="2">ACCREDITED DRUG DISPENSING OUTLET · MACHAME</text>
  ${[150,240,330].map(yy=>`<rect x="760" y="${yy}" width="460" height="10" fill="#8A5A3B"/>`).join('')}
  ${[...Array(18)].map((_,i)=>{const yy=[150,240,330][i%3];const xx=780+Math.floor(i/3)*72;const c=['#E8A33D','#5B8DB8','#B3261E','#F3EEE3','#7FA36A','#7B2D4B'][i%6];return `<rect x="${xx}" y="${yy-48}" width="44" height="48" rx="4" fill="${c}"/><rect x="${xx+6}" y="${yy-34}" width="32" height="8" fill="#fff" opacity=".7"/>`}).join('')}
  <rect x="80" y="130" width="300" height="200" rx="6" fill="#CFE3E0" stroke="#8A5A3B" stroke-width="10"/><path d="M230 130 L230 330 M80 230 L380 230" stroke="#8A5A3B" stroke-width="6"/>
  <path d="M90 300 C150 250 200 280 370 240 L370 320 L90 320Z" fill="#7FA36A" opacity=".8"/>
  <rect x="640" y="390" width="640" height="220" fill="#8A5A3B"/><rect x="640" y="380" width="640" height="20" fill="#6B4430"/>
  <rect x="0" y="560" width="1280" height="60" fill="#D8C7A8"/>`;
}
function hospital(){
  return `<rect width="1280" height="720" fill="url(#sky)"/>
  <path d="M-100 470 C300 430 900 450 1400 440 L1400 720 L-100 720Z" fill="#7FA36A"/>
  <rect x="360" y="170" width="760" height="330" fill="#F6F3EC"/><rect x="360" y="170" width="760" height="40" fill="#5B8DB8"/>
  <text x="740" y="198" text-anchor="middle" font-size="24" font-weight="800" fill="#fff" letter-spacing="3">MACHAME HOSPITAL</text>
  ${[0,1,2,3,4,5].map(i=>`<rect x="${400+i*118}" y="240" width="70" height="60" fill="#8FB7C9"/>`).join('')}
  ${[0,1,2,4,5].map(i=>`<rect x="${400+i*118}" y="340" width="70" height="60" fill="#8FB7C9"/>`).join('')}
  <rect x="690" y="360" width="100" height="140" fill="#0F4A3E"/><path d="M730 330 h20 v-14 h14 v14 h20 v14 h-20 v14 h-14 v-14 h-20Z" fill="#B3261E" transform="translate(-20,-20)"/>
  <circle cx="200" cy="360" r="80" fill="#4F7F45"/><rect x="192" y="400" width="16" height="100" fill="#6B4430"/>
  <rect x="0" y="500" width="1280" height="120" fill="#C8A27A"/>`;
}
function bubble(x,y,w,lines,id,tail='left'){
  const h=24+lines.length*30;
  const tx = tail==='left'? `M${x+30} ${y+h} l-8 26 l30 -26Z` : `M${x+w-40} ${y+h} l14 26 l6 -26Z`;
  return `<g id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="#FFFDF8" stroke="#0F4A3E" stroke-width="2.5"/><path d="${tx}" fill="#FFFDF8" stroke="#0F4A3E" stroke-width="2.5"/><rect x="${x+2}" y="${y+h-4}" width="${w-4}" height="6" fill="#FFFDF8"/>
  ${lines.map((l,i)=>`<text x="${x+20}" y="${y+38+i*30}" font-size="${l.s||22}" class="${l.c||'serif'}" font-style="${l.i?'italic':'normal'}" fill="${l.f||'#0F2E28'}">${l.t}</text>`).join('')}</g>`;
}
function phoneBig(id,x,y){

}

// 0 title

 <text x="640" y="250" text-anchor="middle" font-size="22" fill="#E8A33D" font-weight="600" letter-spacing="4">AMARA FIRST CONTACT · A SIMULATION</text>
 <text x="640" y="330" text-anchor="middle" font-size="64" class="serif" fill="#F3EEE3" font-weight="600">Three mothers, one drug shop</text>

   const bob=Math.abs(Math.sin(t*7))*-8; document.getElementById('n2').setAttribute('transform',`translate(560,${560+bob}) scale(.95)`); });

const stage=document.getElementById('stage');

function renderOld(t){
  const i=S.findIndex(s=>t>=s.a && t<s.b); const idx=i<0?S.length-1:i;
  if(idx!==curScene){ stage.innerHTML=S[idx].build(); curScene=idx; }

  const s=S[idx]; const f=Math.max(1-p(t,s.a,s.a+.35), p(t,s.b-.35,s.b));

  document.getElementById('capEn').textContent=c[2]; document.getElementById('capSw').textContent=c[3];
  document.getElementById('cap').setAttribute('opacity', c[2]?1:0);
  const ch=CHIP.find(c=>t>=c[0]&&t<c[1])||[0,0,''];

}
